<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>QueueFlow</title>
    <style>
        :root {
            --ink: #1E293B;
            --text: #1E293B;
            --mute: #64748B;
            --line: #CBD5E1;
            --bg: #EEF2F6;
            --card: #fff;
            --acc: #00C9A7;
            --accd: #007F69;
            --wait: #94A3B8;
            --diag: #F59E0B;
            --parts: #8B5CF6;
            --test: #3B82F6;
            --done: #16A34A;
            --bad: #DC2626;
            --bar: #1E293B
        }

        @media(prefers-color-scheme:dark) {
            :root {
                --text: #E2E8F0;
                --mute: #94A3B8;
                --line: #334155;
                --bg: #0B1220;
                --card: #162032;
                --accd: #2DE0C0;
                --bar: #0F172A
            }
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom)
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit
        }

        header {
            background: var(--bar);
            color: #E2E8F0;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px clamp(12px, 3vw, 28px);
            position: sticky;
            top: 0;
            z-index: 5;
            border-bottom: 1px solid #334155
        }

        .logo {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -.3px;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .logo svg {
            width: 30px;
            height: 18px
        }

        header .sp {
            flex: 1
        }

        header small {
            color: #94A3B8;
            display: block;
            line-height: 1.1
        }

        .who {
            text-align: right;
            font-size: 13px
        }

        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: clamp(12px, 3vw, 28px)
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px
        }

        h2 {
            margin: 0 0 12px;
            font-size: 18px
        }

        h3 {
            margin: 0 0 8px;
            font-size: 15px
        }

        .btn {
            border: 1px solid var(--line);
            background: var(--card);
            border-radius: 10px;
            padding: 9px 14px;
            cursor: pointer;
            min-height: 40px;
            transition: .15s
        }

        .btn:hover {
            border-color: var(--acc)
        }

        .btn.pri {
            background: var(--acc);
            border-color: var(--acc);
            color: #052E27;
            font-weight: 600
        }

        .btn.pri:hover {
            filter: brightness(1.07)
        }

        .btn.sm {
            padding: 5px 10px;
            min-height: 32px;
            font-size: 13px
        }

        .btn.bad {
            color: var(--bad)
        }

        .btn:disabled {
            opacity: .5
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--card);
            margin: 4px 0 12px
        }

        input:focus,
        select:focus,
        textarea:focus,
        .btn:focus-visible {
            outline: 2px solid var(--acc);
            outline-offset: 1px
        }

        label {
            font-size: 13px;
            color: var(--mute)
        }

        .auth {
            max-width: 420px;
            margin: 6vh auto
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 14px
        }

        .tabs .btn {
            flex: 1
        }

        .tabs .on {
            background: var(--bar);
            color: #fff;
            border-color: var(--bar)
        }

        .demo {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px
        }

        .demo .btn {
            font-size: 12px;
            padding: 4px 10px;
            min-height: 30px
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(300px, 400px) 1fr;
            gap: 18px;
            align-items: start
        }

        @media(max-width:820px) {
            .grid {
                grid-template-columns: 1fr
            }
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 6px 0 14px
        }

        .chip {
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            cursor: pointer;
            background: var(--card);
            font-size: 14px
        }

        .chip.on {
            background: var(--bar);
            color: #fff;
            border-color: var(--bar);
            box-shadow: inset 0 -3px 0 var(--acc)
        }

        .t {
            display: grid;
            grid-template-columns: 84px 1fr;
            gap: 14px;
            margin-bottom: 14px
        }

        .ring {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            text-align: center;
            line-height: 1.1;
            background: conic-gradient(var(--c) var(--p), var(--line) 0)
        }

        .ring b {
            display: grid;
            place-items: center;
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: var(--card);
            font-size: 22px
        }

        .ring small {
            font-size: 10px;
            color: var(--mute);
            display: block;
            font-weight: 400
        }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            color: #fff
        }

        .s-waiting {
            background: var(--wait)
        }

        .s-diagnosing {
            background: var(--diag)
        }

        .s-awaiting_parts {
            background: var(--parts)
        }

        .s-testing {
            background: var(--test)
        }

        .s-completed {
            background: var(--done)
        }

        .s-cancelled {
            background: var(--bad)
        }

        .steps {
            display: flex;
            gap: 4px;
            margin: 10px 0
        }

        .steps i {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: var(--line)
        }

        .steps i.on {
            background: var(--acc)
        }

        .mute {
            color: var(--mute);
            font-size: 13px
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 18px
        }

        .stat b {
            display: block;
            font-size: 26px;
            letter-spacing: -.5px
        }

        .board {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(250px, 1fr);
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding-bottom: 8px
        }

        .col {
            scroll-snap-align: start;
            background: color-mix(in srgb, var(--line) 35%, transparent);
            border-radius: 14px;
            padding: 10px;
            min-height: 200px
        }

        .col h3 {
            display: flex;
            justify-content: space-between;
            border-left: 4px solid var(--c);
            padding-left: 8px
        }

        .tk {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 14px;
            animation: in .25s
        }

        @keyframes in {
            from {
                opacity: 0;
                transform: translateY(-4px)
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important
            }
        }

        .tk .row {
            margin-top: 8px
        }

        .nav {
            display: flex;
            gap: 6px;
            margin-bottom: 16px
        }

        .nav .on {
            background: var(--bar);
            color: #fff;
            border-color: var(--bar)
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        td,
        th {
            padding: 8px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            font-size: 14px
        }

        .tw {
            overflow-x: auto
        }

        .tw input {
            margin: 0;
            width: 90px
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: calc(20px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            display: grid;
            gap: 8px;
            z-index: 20;
            width: min(92vw, 420px)
        }

        #toast div {
            background: var(--bar);
            color: #fff;
            padding: 12px 16px;
            border-radius: 12px;
            border-left: 5px solid var(--acc);
            box-shadow: 0 6px 24px #0004
        }

        #toast .err {
            border-color: var(--bad)
        }

        .modal {
            position: fixed;
            inset: 0;
            background: #0008;
            display: grid;
            place-items: center;
            padding: 16px;
            z-index: 10
        }

        .modal .card {
            width: min(440px, 100%);
            max-height: 90vh;
            overflow: auto
        }

        .live {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--acc);
            display: inline-block;
            margin-right: 6px;
            animation: pl 2s infinite
        }

        @keyframes pl {
            50% {
                opacity: .3
            }
        }
    
        .badge.s-trial{background:var(--test)}
        .badge.s-active{background:var(--done)}
        .badge.s-suspended{background:var(--bad)}
        .banner{border-radius:12px;padding:12px 16px;margin-bottom:14px;border:1px solid var(--line);background:var(--card)}
        .banner.bad{border-color:var(--bad);color:var(--bad)}
        .banner.info{border-color:var(--test)}
        .meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0 10px}
        .meter i{display:block;height:100%;background:var(--acc)}
        .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-bottom:18px;align-items:start}
        .big{font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
        ul.perks{margin:8px 0 0;padding-left:20px}
        .lockrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
        .lockrow:last-child{border-bottom:0}
        a.btn{text-decoration:none;display:inline-flex;align-items:center}
        .cur{background:color-mix(in srgb,var(--acc) 16%,transparent)}
        td select{margin:0;min-width:150px}
        .bars{display:flex;gap:10px;align-items:flex-end;height:170px;padding-top:10px}
        .bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;text-align:center}
        .bcol i{display:block;width:100%;background:var(--acc);border-radius:6px 6px 0 0}
        .bcol small,.bcol .bv{font-size:11px;color:var(--mute)}
        .check{display:flex;gap:8px;align-items:center;margin:0 0 12px;color:var(--text)}
        .check input{width:auto;margin:0}

</style>
</head>

<body>
    <header>
        <div class="logo"><svg viewBox="0 0 60 36" fill="none" stroke="#00C9A7" stroke-width="6" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M30 18c-5-8-10-12-16-12C7 6 3 11 3 18s4 12 11 12c6 0 11-4 16-12s10-12 16-12h6" />
                <path d="M50 2l7 4-5 7" />
            </svg>QueueFlow</div>
        <span class="sp"></span>
        <div class="who" id="who"></div><button class="btn sm" id="out" hidden>Sign out</button>
    </header>
    <main id="app"></main>
    <div id="toast"></div>
    <script>
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const FULL = ['waiting', 'diagnosing', 'awaiting_parts', 'testing', 'completed'], SIMPLE = ['waiting', 'diagnosing', 'completed'];
const LF = { waiting: 'In queue', diagnosing: 'Diagnosing', awaiting_parts: 'Awaiting parts', testing: 'Testing', completed: 'Ready for pickup', cancelled: 'Cancelled' };
const LS = { ...LF, diagnosing: 'In progress', completed: 'Completed' }; // Starter plan wording
const lbl = (s, ms) => (ms === false ? LS : LF)[s] || s, steps = ms => ms === false ? SIMPLE : FULL;
const COLOR = { waiting: '--wait', diagnosing: '--diag', awaiting_parts: '--parts', testing: '--test', completed: '--done' };
const NF = { waiting: [['diagnosing', 'Start diagnosing']], diagnosing: [['awaiting_parts', 'Needs parts'], ['testing', 'Move to testing']], awaiting_parts: [['diagnosing', 'Parts arrived']], testing: [['completed', 'Mark completed'], ['diagnosing', 'Back']] };
const NS = { waiting: [['diagnosing', 'Start repair']], diagnosing: [['completed', 'Mark completed']] };
const DEV = ['Smartphone', 'Laptop', 'Desktop', 'Tablet', 'Console', 'Smartwatch', 'Other'];
const MAIL = 'admin@flowrescent.ph';
const peso = n => '₱' + Number(n || 0).toLocaleString('en-PH'), mins = n => n < 1 ? 'Next up' : n < 60 ? `~${n} min` : `~${Math.floor(n / 60)}h ${n % 60}m`;
const dt = n => new Date(n).toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });
const daysLeft = n => Math.ceil((n - Date.now()) / 864e5);
let S = { token: localStorage.qf_token, user: null, svcs: [], services: [], data: null, sub: null, an: null, tab: 'a', dev: 'Smartphone', view: 'login', seen: null, timer: null, shop: null, sig: null, draft: {} };

function toast(m, err) { const d = document.createElement('div'); d.textContent = m; if (err) d.className = 'err'; $('#toast').append(d); setTimeout(() => d.remove(), 5000) }
async function api(p, o = {}) {
    const r = await fetch('/api' + p, { method: o.method || 'GET', headers: { 'content-type': 'application/json', ...(S.token ? { authorization: 'Bearer ' + S.token } : {}) }, body: o.body ? JSON.stringify(o.body) : undefined });
    const j = await r.json().catch(() => ({})); if (r.status === 401 && S.user) logout(); if (!r.ok) throw new Error(j.error || 'Something went wrong'); return j
}
function logout() { localStorage.removeItem('qf_token'); Object.assign(S, { token: null, user: null, data: null, sub: null, an: null, seen: null, shop: null, svcs: [], services: [], tab: 'a', sig: null }); clearInterval(S.timer); $('#out').hidden = true; $('#who').innerHTML = ''; render() }
$('#out').onclick = logout;
async function boot() {
    try { if (S.token) S.user = await api('/me') } catch (e) { S.token = null }
    if (S.user) start(); render()
}
const ROLE = { admin: 'Flowrescent · System admin', owner: 'Shop owner · Administrator', technician: 'Technician', customer: 'Customer' };
function start() {
    $('#out').hidden = false; S.tab = 'a';
    if (S.user.role === 'customer' && 'Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    load(true); clearInterval(S.timer); S.timer = setInterval(load, 4000)
}
function who() { const shop = S.data?.sub?.name; $('#who').innerHTML = `${esc(S.user.name)}<small>${ROLE[S.user.role] || ''}${shop ? ' · ' + esc(shop) : ''}</small>` }
async function load(force) {
    if ((document.hidden && force !== true) || !S.user) return;
    try {
        const r = S.user.role;
        if (r === 'admin') S.data = await api('/sa/overview');
        else if (r === 'customer') {
            S.data = await api('/tickets/mine'); notify();
            const sh = S.data.shops; if (!sh.find(x => x.id === S.shop)) S.shop = sh[0]?.id ?? null;
            S.svcs = S.shop ? await api('/services?shop=' + S.shop) : []
        } else {
            S.data = await api('/admin/queue'); S.services = await api('/admin/services');
            if (r === 'owner' && S.tab === 'c') S.sub = await api('/admin/subscription');
            if (r === 'owner' && S.tab === 'e' && S.data.sub.analytics) S.an = await api('/admin/analytics')
        }
        const sig = JSON.stringify([S.data, S.sub, S.an, S.services, S.svcs, S.shop, S.tab, S.dev]);
        if (force === true || sig !== S.sig) { if (!document.querySelector('.modal') && !document.activeElement?.matches?.('input,select,textarea')) { S.sig = sig; render() } }
    } catch (e) { if (force === true) toast(e.message, 1) }
}
function notify() { // alerts only exist on plans that include them
    const now = {}; S.data.tickets.forEach(t => now[t.id] = t.status);
    if (S.seen) S.data.tickets.forEach(t => { if (t.alerts && S.seen[t.id] && S.seen[t.id] !== t.status) { const m = `${t.code} · ${t.device}: ${lbl(t.status, t.milestones)}`; toast(m); try { new Notification('QueueFlow', { body: m }) } catch { } } }); S.seen = now
}
function render() {
    const a = $('#app'); if (S.user) who();
    if (!S.user) a.innerHTML = authView();
    else if (S.user.role === 'admin') a.innerHTML = saView();
    else if (S.user.role === 'customer') a.innerHTML = customerView();
    else a.innerHTML = staffView()
}
function authView() {
    const reg = S.view === 'register';
    return `<div class="card auth"><div class="tabs"><button class="btn ${!reg ? 'on' : ''}" data-a="view" data-v="login">Sign in</button><button class="btn ${reg ? 'on' : ''}" data-a="view" data-v="register">Create account</button></div>
<form id="af">${reg ? '<label>Full name</label><input name="name" required autocomplete="name"><label>Mobile number (optional)</label><input name="phone" inputmode="tel">' : ''}
<label>Email</label><input name="email" type="email" required autocomplete="email"><label>Password</label><input name="password" type="password" required minlength="${reg ? 8 : 1}" autocomplete="${reg ? 'new-password' : 'current-password'}">
<button class="btn pri" style="width:100%">${reg ? 'Create account' : 'Sign in'}</button></form>
${reg ? '<p class="mute">Customer accounts only. Repair shops are set up by Flowrescent.</p>' : `<div class="demo"><span class="mute">Demo:</span><button class="btn" data-a="fill" data-e="owner@queueflow.ph" data-p="Queue#2026">Shop owner</button><button class="btn" data-a="fill" data-e="ana@queueflow.ph" data-p="Queue#2026">Customer</button><button class="btn" data-a="fill" data-e="admin@flowrescent.ph" data-p="">Flowrescent admin</button></div>`}</div>`
}

/* ---------------- Customer ---------------- */
function customerView() {
    const D = S.data || { shops: [], tickets: [] }, shops = D.shops, T = D.tickets, cur = shops.find(s => s.id === S.shop);
    const act = T.filter(t => t.status !== 'cancelled' && (t.status !== 'completed' || Date.now() - t.done_at < 864e5)), old = T.filter(t => !act.includes(t));
    const svcs = S.svcs.filter(s => s.device_type === S.dev), d = S.draft;
    const form = !shops.length ? '<div class="card"><h2>Book a repair</h2><p class="mute">No repair shops are open for booking right now.</p></div>' :
        `<form class="card" id="bf"><h2>Book a repair</h2><label>Repair shop</label><select name="shop" data-a="shop">${shops.map(s => `<option value="${s.id}" ${s.id === S.shop ? 'selected' : ''}>${esc(s.name)} · ${s.queue} in queue</option>`).join('')}</select>
<label>What are you bringing?</label><div class="chips">${DEV.map(x => `<span class="chip ${x === S.dev ? 'on' : ''}" tabindex="0" role="button" data-a="dev" data-d="${x}">${x}</span>`).join('')}</div>
<label>Brand and model</label><input name="device" required value="${esc(d.device)}" placeholder="e.g. Samsung A54, Lenovo ThinkPad T14"><label>Service</label><select name="service_id" required>${svcs.length ? svcs.map(s => `<option value="${s.id}">${esc(s.name)} · ${peso(s.price)} · ~${s.minutes} min</option>`).join('') : '<option value="">This shop has no service for this device</option>'}</select>
<label>What's wrong? (optional)</label><textarea name="issue" rows="3" maxlength="500">${esc(d.issue)}</textarea><button class="btn pri" style="width:100%" ${svcs.length ? '' : 'disabled'}>Join the queue</button>
<p class="mute">${cur ? `${cur.queue} device${cur.queue == 1 ? '' : 's'} in ${esc(cur.name)} right now.` : ''} Price is an estimate until diagnosis.</p></form>`;
    return `<div class="grid">${form}
<div><h2><span class="live"></span>My repairs</h2>${act.length ? act.map(tk).join('') : '<div class="card mute">No active repairs. Book one and your place in line shows here live.</div>'}
${old.length ? `<h3 style="margin-top:22px">History</h3><div class="card tw"><table>${old.map(t => `<tr><td>${esc(t.code)}</td><td>${esc(t.device)}<br><span class="mute">${esc(t.service_name)}${t.shop_name ? ' · ' + esc(t.shop_name) : ''}</span></td><td>${peso(t.price)}</td><td><span class="badge s-${t.status}">${lbl(t.status, t.milestones)}</span></td></tr>`).join('')}</table></div>` : ''}</div></div>`
}
function tk(t) {
    const ST = steps(t.milestones), i = ST.indexOf(t.status), act = t.status !== 'completed', pct = act ? Math.max(8, 100 / (t.position || 1)) : 100;
    return `<div class="card t" style="--c:var(${COLOR[t.status]})"><div class="ring" style="--p:${pct}%;--c:var(${COLOR[t.status]})"><b>${act ? '#' + t.position : '✓'}<small>${act ? 'in line' : 'done'}</small></b></div>
<div><div class="row"><b>${esc(t.code)}</b><span class="badge s-${t.status}">${lbl(t.status, t.milestones)}</span></div><div>${esc(t.device)} · ${esc(t.service_name)}</div><div class="mute">${esc(t.shop_name || '')}</div>
<div class="steps">${ST.map((s, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>
<div class="mute">${act ? (t.status === 'awaiting_parts' ? 'Waiting on parts — the shop will update you.' : 'Estimated wait: <b>' + mins(t.wait) + '</b> before your repair starts') : 'Your device is ready. Bring your queue code ' + esc(t.code) + '.'}</div>
${t.status === 'waiting' ? `<div class="row" style="margin-top:8px"><button class="btn sm bad" data-a="cancel" data-id="${t.id}">Cancel booking</button></div>` : ''}</div></div>`
}

/* ---------------- Shop owner / technician ---------------- */
function lockCard(feature, plan) {
    return `<div class="card"><h2>🔒 ${esc(feature)}</h2><p class="mute">This feature is part of the <b>${plan}</b> plan. Your shop is on a lower plan.</p><a class="btn pri" href="mailto:${MAIL}?subject=${encodeURIComponent('Upgrade request: ' + feature)}">Request an upgrade</a></div>`
}
function staffView() {
    const d = S.data; if (!d) return '<div class="card">Loading…</div>';
    const sub = d.sub, st = d.stats, isOwner = S.user.role === 'owner', ms = !!sub.milestones, ST = ms ? FULL : SIMPLE, NEXT = ms ? NF : NS;
    const tabs = [['a', 'Live queue']]; if (isOwner) tabs.push(['b', 'Services & prices'], ['c', 'My subscription'], ['e', (sub.analytics ? '' : '🔒 ') + 'Analytics']);
    const nav = `<div class="nav" style="flex-wrap:wrap">${tabs.map(([k, n]) => `<button class="btn ${S.tab === k ? 'on' : ''}" data-a="tab" data-t="${k}">${n}</button>`).join('')}<span style="flex:1"></span><button class="btn pri" data-a="walk">+ Walk-in</button></div>`;
    let banner = ''; const dl = daysLeft(sub.next_billing);
    if (sub.status === 'suspended') banner = '<div class="banner bad"><b>Subscription suspended.</b> Booking and queue changes are paused. Contact Flowrescent to reactivate.</div>';
    else if (sub.status === 'trial') banner = `<div class="banner info"><b>Free trial</b> — ${dl > 0 ? dl + ' day' + (dl == 1 ? '' : 's') + ' left' : 'ended'}. ${isOwner ? 'See “My subscription” for your plan.' : ''}</div>`;
    if (S.tab === 'b' && isOwner) return nav + banner + servicesTab();
    if (S.tab === 'c' && isOwner) return nav + banner + subTab();
    if (S.tab === 'e' && isOwner) return nav + banner + analyticsTab();
    return nav + banner + `<div class="stats"><div class="card stat"><b>${st.active}</b><span class="mute">In the shop now</span></div><div class="card stat"><b>${st.completed}</b><span class="mute">Completed today</span></div><div class="card stat"><b>${peso(st.revenue)}</b><span class="mute">Earned today</span></div><div class="card stat"><b>${st.avgMinutes ?? '—'}${st.avgMinutes ? ' min' : ''}</b><span class="mute">Avg repair time</span></div></div>
<div class="board">${ST.map(s => { const L = d.tickets.filter(t => t.status === s); return `<div class="col" style="--c:var(${COLOR[s]})"><h3>${(ms ? LF : LS)[s].replace('Ready for pickup', 'Completed')}<span class="mute">${L.length}</span></h3>${L.map(t => `<div class="tk"><div class="row"><b>${esc(t.code)}</b><span class="mute">${t.source === 'walk-in' ? 'Walk-in' : 'App'}</span><span class="mute" style="margin-left:auto">${t.position ? '#' + t.position : ''}</span></div>${esc(t.customer_name)}<br><span class="mute">${esc(t.device)} · ${esc(t.service_name)}${t.issue ? '<br>“' + esc(t.issue) + '”' : ''}</span><div class="row">${(NEXT[s] || []).map(([to, n], k) => `<button class="btn sm ${k ? '' : 'pri'}" data-a="mv" data-id="${t.id}" data-to="${to}">${n}</button>`).join('')}${NEXT[s] ? `<button class="btn sm bad" data-a="mv" data-id="${t.id}" data-to="cancelled">Cancel</button>` : ''}</div></div>`).join('') || '<p class="mute">Empty</p>'}</div>` }).join('')}</div>
${ms ? '' : '<p class="mute" style="margin-top:12px">Your Starter plan uses the simple flow (In queue → In progress → Completed). Awaiting-parts and Testing steps are available on the Standard plan.</p>'}`
}
function servicesTab() {
    return `<div class="card"><h2>Services & prices</h2><p class="mute">Changes apply to new bookings. Customers only see active services.</p><div class="tw"><table><tr><th>Device</th><th>Service</th><th>Minutes</th><th>Price ₱</th><th>Active</th></tr>${S.services.map(s => `<tr><td>${s.device_type}</td><td>${esc(s.name)}</td><td><input type="number" min="5" value="${s.minutes}" data-a="svc" data-id="${s.id}" data-f="minutes"></td><td><input type="number" min="0" value="${s.price}" data-a="svc" data-id="${s.id}" data-f="price"></td><td><input type="checkbox" style="width:auto" ${s.active ? 'checked' : ''} data-a="svc" data-id="${s.id}" data-f="active"></td></tr>`).join('')}</table></div>
<form id="sf" class="row" style="margin-top:14px;align-items:end"><div><label>Device</label><select name="device_type">${DEV.map(x => `<option>${x}</option>`).join('')}</select></div><div><label>Service name</label><input name="name" required></div><div><label>Minutes</label><input name="minutes" type="number" min="5" required></div><div><label>Price ₱</label><input name="price" type="number" min="0" required></div><button class="btn pri" style="margin-bottom:12px">Add service</button></form></div>`
}
function subTab() {
    const x = S.sub; if (!x) return '<div class="card">Loading…</div>';
    const s = x.sub, used = x.staff.length, lim = s.max_staff, unl = lim < 0, full = !unl && used >= lim;
    const locked = []; if (!s.milestones) locked.push(['Repair milestones (Awaiting parts, Testing)', 'Standard']); if (!s.alerts) locked.push(['SMS / push alerts to customers', 'Standard']); if (lim === 0) locked.push(['Technician accounts', 'Standard']); if (!s.analytics) locked.push(['Multi-branch analytics', 'Enterprise']);
    const yes = v => v ? '✓' : '—', cap = p => p.max_staff < 0 ? 'Unlimited' : p.max_staff || 'None';
    return `<div class="two"><div class="card"><div class="row"><h2 style="margin:0">My subscription</h2><span class="badge s-${s.status}">${s.status}</span></div>
<div class="big" style="margin-top:10px">${esc(s.plan_name)}</div><div>${peso(s.monthly)} / month · ${peso(s.setup)} one-time setup</div>
<p><b>${s.status === 'trial' ? 'Trial ends' : 'Next billing'}:</b> ${dt(s.next_billing)} <span class="mute">(${daysLeft(s.next_billing)} days)</span></p>
<p class="mute">Monthly billing and receipts are handled by Flowrescent’s finance partner.</p><h3>Included in your plan</h3><ul class="perks">${s.perks.split('|').map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>
<div class="card"><h2>Technician accounts</h2><b>${used} of ${unl ? 'unlimited' : lim} used</b>${unl ? '' : `<div class="meter"><i style="width:${lim ? Math.min(100, used / lim * 100) : 100}%"></i></div>`}
${x.staff.map(t => `<div class="lockrow"><span>${esc(t.name)}<br><span class="mute">${esc(t.email)}</span></span><button class="btn sm bad" data-a="rmtech" data-id="${t.id}">Remove</button></div>`).join('') || '<p class="mute">No technician accounts yet.</p>'}
<div class="row" style="margin-top:12px">${lim === 0 ? '<span class="mute">🔒 Technician accounts start on the Standard plan.</span>' : `<button class="btn pri" data-a="addtech" ${full ? 'disabled' : ''}>+ Add technician</button>${full ? '<span class="mute">Limit reached — ask Flowrescent to upgrade.</span>' : ''}`}</div></div></div>
${locked.length ? `<div class="card" style="margin-bottom:18px"><h2>Locked on your plan</h2>${locked.map(([f, p]) => `<div class="lockrow"><span>🔒 ${f}<br><span class="mute">Available on ${p}</span></span><a class="btn sm pri" href="mailto:${MAIL}?subject=${encodeURIComponent('Upgrade request: ' + f)}">Request upgrade</a></div>`).join('')}</div>` : ''}
<div class="card tw"><h2>Compare plans</h2><table><tr><th>Plan</th><th>Setup</th><th>Monthly</th><th>Technicians</th><th>Milestones</th><th>Alerts</th><th>Analytics</th></tr>${x.plans.map(p => `<tr class="${p.id === s.plan_id ? 'cur' : ''}"><td><b>${esc(p.name)}</b>${p.id === s.plan_id ? ' <span class="mute">(yours)</span>' : ''}</td><td>${peso(p.setup)}</td><td>${peso(p.monthly)}</td><td>${cap(p)}</td><td>${yes(p.milestones)}</td><td>${yes(p.alerts)}</td><td>${yes(p.analytics)}</td></tr>`).join('')}</table></div>`
}
function analyticsTab() {
    const s = S.data.sub; if (!s.analytics) return lockCard('Multi-branch analytics', 'Enterprise');
    const a = S.an; if (!a) return '<div class="card">Loading…</div>';
    const tot = a.branches.reduce((o, b) => ({ done: o.done + b.done, rev: o.rev + b.revenue, act: o.act + b.active }), { done: 0, rev: 0, act: 0 });
    const today = Math.floor((Date.now() + 288e5) / 864e5), days = [6, 5, 4, 3, 2, 1, 0].map(i => { const d = today - i, f = a.daily.find(x => x.d === d); return { l: new Date(d * 864e5).toISOString().slice(5, 10), r: f?.revenue || 0 } }), max = Math.max(1, ...days.map(d => d.r));
    return `<div class="stats"><div class="card stat"><b>${a.branches.length}</b><span class="mute">Branches</span></div><div class="card stat"><b>${tot.act}</b><span class="mute">In queue now (all)</span></div><div class="card stat"><b>${tot.done}</b><span class="mute">Completed · 30 days</span></div><div class="card stat"><b>${peso(tot.rev)}</b><span class="mute">Revenue · 30 days</span></div></div>
<div class="card tw" style="margin-bottom:18px"><h2>Per-branch performance (last 30 days)</h2><table><tr><th>Branch</th><th>In queue</th><th>Completed</th><th>Revenue</th><th>Avg repair</th></tr>${a.branches.map(b => `<tr><td><b>${esc(b.name)}</b></td><td>${b.active}</td><td>${b.done}</td><td>${peso(b.revenue)}</td><td>${b.avg_min ? b.avg_min + ' min' : '—'}</td></tr>`).join('')}</table></div>
<div class="two"><div class="card"><h2>Revenue · last 7 days</h2><div class="bars">${days.map(d => `<div class="bcol"><span class="bv">${d.r ? peso(d.r) : ''}</span><i style="height:${Math.max(2, d.r / max * 100)}%"></i><small>${d.l}</small></div>`).join('')}</div></div>
<div class="card"><h2>Top services</h2>${a.top.map(t => `<div class="lockrow"><span>${esc(t.name)}</span><span class="mute">${t.n} jobs · ${peso(t.revenue)}</span></div>`).join('') || '<p class="mute">No completed repairs yet.</p>'}</div></div>`
}

/* ---------------- Flowrescent system admin ---------------- */
function saView() {
    const d = S.data; if (!d) return '<div class="card">Loading…</div>';
    const by = st => d.shops.filter(s => s.status === st).length, name = id => d.shops.find(s => s.id === id)?.name || '';
    return `<div class="nav"><h2 style="margin:0;align-self:center">All shops</h2><span style="flex:1"></span><button class="btn pri" data-a="sa-add">+ Add shop</button></div>
<div class="stats"><div class="card stat"><b>${peso(d.mrr)}</b><span class="mute">Monthly revenue (active shops)</span></div><div class="card stat"><b>${by('active')}</b><span class="mute">Active shops</span></div><div class="card stat"><b>${by('trial')}</b><span class="mute">On free trial</span></div><div class="card stat"><b>${by('suspended')}</b><span class="mute">Suspended</span></div></div>
<div class="card tw"><table><tr><th>Shop</th><th>Owner login</th><th>Plan</th><th>Status</th><th>Next billing</th><th>Techs</th><th>Tickets</th><th></th></tr>${d.shops.map(s => `<tr><td><b>${esc(s.name)}</b>${s.parent_id ? `<br><span class="mute">Branch of ${esc(name(s.parent_id))}</span>` : ''}</td><td>${esc(s.owner_email || '—')}</td>
<td>${s.parent_id ? esc(s.plan_name) : `<select data-a="sa-plan" data-id="${s.id}">${d.plans.map(p => `<option value="${p.id}" ${p.id === s.plan_id ? 'selected' : ''}>${esc(p.name)} · ${peso(p.monthly)}</option>`).join('')}</select>`}</td>
<td><span class="badge s-${s.status}">${s.status}</span></td><td>${dt(s.next_billing)}</td><td>${s.staff}</td><td>${s.tickets}</td>
<td>${s.parent_id ? '<span class="mute">follows head office</span>' : `<div class="row">${s.status === 'suspended' ? `<button class="btn sm" data-a="sa-status" data-id="${s.id}" data-s="active">Reactivate</button>` : `<button class="btn sm bad" data-a="sa-status" data-id="${s.id}" data-s="suspended">Suspend</button>`}<button class="btn sm" data-a="sa-renew" data-id="${s.id}">${s.status === 'trial' ? 'Activate' : 'Mark paid +30d'}</button></div>`}</td></tr>`).join('')}</table></div>
<h3 style="margin-top:22px">Plans</h3><div class="two">${d.plans.map(p => `<div class="card"><b>${esc(p.name)}</b><div class="big">${peso(p.monthly)}<span class="mute" style="font-size:14px;font-weight:400"> / month</span></div><div class="mute">${peso(p.setup)} setup · ${d.shops.filter(s => s.plan_id === p.id).length} shop(s)</div><ul class="perks">${p.perks.split('|').map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>`
}

/* ---------------- modals ---------------- */
function modal(html) { const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = html; document.body.append(m); return m }
function walkModal() {
    let dev = 'Smartphone';
    const m = modal(''), draw = () => {
        m.innerHTML = `<form class="card" id="wf"><h2>Add walk-in customer</h2><label>Customer name</label><input name="customer_name" required><label>Device type</label><select id="wd">${DEV.map(d => `<option ${d === dev ? 'selected' : ''}>${d}</option>`).join('')}</select><label>Brand and model</label><input name="device" required><label>Service</label><select name="service_id" required>${S.services.filter(s => s.active && s.device_type === dev).map(s => `<option value="${s.id}">${esc(s.name)} · ${peso(s.price)}</option>`).join('') || '<option value="">No service for this device</option>'}</select><label>Issue</label><textarea name="issue" rows="2"></textarea><div class="row"><button class="btn pri">Add to queue</button><button type="button" class="btn" data-a="close">Close</button></div></form>`;
        m.querySelector('#wd').onchange = e => { const keep = Object.fromEntries(new FormData(m.querySelector('form'))); dev = e.target.value; draw();['customer_name', 'device', 'issue'].forEach(k => m.querySelector(`[name=${k}]`).value = keep[k] || '') }
    };
    draw()
}
const techModal = () => modal(`<form class="card" id="tf"><h2>Add technician</h2><label>Full name</label><input name="name" required><label>Email (login)</label><input name="email" type="email" required><label>Temporary password (8+ characters)</label><input name="password" type="text" minlength="8" required><div class="row"><button class="btn pri">Create account</button><button type="button" class="btn" data-a="close">Close</button></div></form>`);
function shopModal() {
    const d = S.data, heads = d.shops.filter(s => !s.parent_id && d.plans.find(p => p.id === s.plan_id)?.analytics);
    modal(`<form class="card" id="nf"><h2>Add a shop</h2><label>Shop name</label><input name="name" required><label>Owner name</label><input name="owner_name" required><label>Owner email (login)</label><input name="owner_email" type="email" required><label>Temporary password (8+ characters)</label><input name="owner_password" type="text" minlength="8" required>
<label>Plan</label><select name="plan_id" id="np">${d.plans.map(p => `<option value="${p.id}">${esc(p.name)} · ${peso(p.monthly)}/mo · ${peso(p.setup)} setup</option>`).join('')}</select>
<label>Branch of (Enterprise head office only)</label><select name="parent_id" id="npar"><option value="">— Independent shop —</option>${heads.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>
<label class="check"><input type="checkbox" name="trial"> Start with a 30-day free trial</label><div class="row"><button class="btn pri">Create shop</button><button type="button" class="btn" data-a="close">Close</button></div></form>`);
    $('#npar').onchange = e => { $('#np').disabled = !!e.target.value }
}

/* ---------------- events ---------------- */
const patchShop = async (id, body, msg) => { await api('/sa/shops/' + id, { method: 'PATCH', body }); toast(msg); load(true) };
document.addEventListener('click', async e => {
    const x = e.target.closest('[data-a]'); if (!x || x.tagName === 'INPUT' || x.tagName === 'SELECT') return; const a = x.dataset.a; try {
        if (a === 'view') { S.view = x.dataset.v; render() }
        else if (a === 'fill') { S.view = 'login'; render(); const f = $('#af'); f.email.value = x.dataset.e; f.password.value = x.dataset.p; f.password.focus() }
        else if (a === 'dev') { S.dev = x.dataset.d; render() }
        else if (a === 'tab') { S.tab = x.dataset.t; render(); load(true) }
        else if (a === 'close') x.closest('.modal').remove();
        else if (a === 'cancel') { if (confirm('Cancel this booking?')) { await api(`/tickets/${x.dataset.id}/cancel`, { method: 'POST' }); toast('Booking cancelled'); load(true) } }
        else if (a === 'mv') { await api(`/admin/tickets/${x.dataset.id}`, { method: 'PATCH', body: { status: x.dataset.to } }); load(true) }
        else if (a === 'walk') walkModal();
        else if (a === 'addtech') techModal();
        else if (a === 'rmtech') { if (confirm('Remove this technician account?')) { await api(`/admin/staff/${x.dataset.id}/remove`, { method: 'POST' }); toast('Technician removed'); load(true) } }
        else if (a === 'sa-add') shopModal();
        else if (a === 'sa-status') { if (x.dataset.s === 'active' || confirm('Suspend this shop? Its staff and customers will be locked out.')) patchShop(x.dataset.id, { status: x.dataset.s }, x.dataset.s === 'active' ? 'Shop reactivated' : 'Shop suspended') }
        else if (a === 'sa-renew') patchShop(x.dataset.id, { renew: true }, 'Marked paid — billing extended 30 days');
    } catch (er) { toast(er.message, 1) }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.chip')) e.target.click() });
document.addEventListener('input', e => { if (e.target.form?.id === 'bf' && ['device', 'issue'].includes(e.target.name)) S.draft[e.target.name] = e.target.value });
document.addEventListener('change', async e => {
    const x = e.target, a = x.dataset.a; try {
        if (a === 'svc') { const v = x.type === 'checkbox' ? +x.checked : +x.value; await api('/admin/services/' + x.dataset.id, { method: 'PATCH', body: { [x.dataset.f]: v } }); toast('Saved'); load(true) }
        else if (a === 'shop') { S.shop = +x.value; S.svcs = await api('/services?shop=' + S.shop); render() }
        else if (a === 'sa-plan') patchShop(x.dataset.id, { plan_id: +x.value }, 'Plan changed')
    } catch (er) { toast(er.message, 1) }
});
document.addEventListener('submit', async e => {
    e.preventDefault(); const f = e.target, v = Object.fromEntries(new FormData(f)); try {
        if (f.id === 'af') { const r = await api(S.view === 'register' ? '/register' : '/login', { method: 'POST', body: v }); S.token = r.token; localStorage.qf_token = r.token; S.user = r.user; start(); render() }
        else if (f.id === 'bf') { const r = await api('/tickets', { method: 'POST', body: { service_id: v.service_id, device: v.device, issue: v.issue } }); toast(`You're in the queue as ${r.code}`); S.draft = {}; load(true) }
        else if (f.id === 'wf') { await api('/tickets', { method: 'POST', body: v }); document.querySelector('.modal').remove(); toast('Walk-in added'); load(true) }
        else if (f.id === 'sf') { await api('/admin/services', { method: 'POST', body: v }); toast('Service added'); load(true) }
        else if (f.id === 'tf') { await api('/admin/staff', { method: 'POST', body: v }); document.querySelector('.modal').remove(); toast('Technician added'); load(true) }
        else if (f.id === 'nf') { await api('/sa/shops', { method: 'POST', body: { name: v.name, owner_name: v.owner_name, owner_email: v.owner_email, owner_password: v.owner_password, plan_id: +v.plan_id || undefined, parent_id: +v.parent_id || null, trial: !!v.trial } }); document.querySelector('.modal').remove(); toast('Shop created'); load(true) }
    } catch (er) { toast(er.message, 1) }
});
document.addEventListener('visibilitychange', () => load()); boot();
</script>
</body>

</html>
